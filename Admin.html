<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassPulse Live｜講師登入</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:linear-gradient(145deg,#081c4b,#2655ae 58%,#6036a4);font-family:Arial,"Noto Sans TC",sans-serif;color:#142044}.box{width:min(100%,440px);padding:29px;border-radius:25px;background:#fff;box-shadow:0 25px 70px #03103480}.brand{color:#305fcd;font-weight:800;letter-spacing:.09em;font-size:13px}.dots{color:#ea4335;letter-spacing:2px}.box h1{font-size:27px;margin:16px 0 8px}.box p{color:#61708b;line-height:1.7}.input{width:100%;margin-top:8px;padding:15px;border:1px solid #d6dfef;border-radius:13px;font:inherit}.button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:13px;color:#fff;background:linear-gradient(105deg,#306de8,#6545d9);font-weight:800;font-size:16px;cursor:pointer}.hint{font-size:12px;margin-top:16px!important}</style></head><body><main class="box"><div class="brand"><span class="dots">●●●●</span> CLASS PULSE LIVE</div><h1>講師控制台</h1><p>輸入講師管理密碼後，將安全地開啟課堂控制台。</p><input class="input" id="key" type="password" autocomplete="current-password" placeholder="管理密碼"><button class="button" onclick="go()">進入講師控制台 →</button><p class="hint">控制台會在 Apps Script 正式服務中開啟，以保護作答統計與刪除功能。</p></main><script>const APP='https://script.google.com/macros/s/AKfycbw2DmpkxEYlN89Y4zhDgYtf8T9ZrUGDWgO4wHF0ec1eUTB7RjW5XNq69kDHzdfL9erW/exec';function go(){const k=document.getElementById('key').value;if(!k){document.getElementById('key').focus();return}location.href=APP+'?adminKey='+encodeURIComponent(k)}document.getElementById('key').addEventListener('keydown',e=>{if(e.key==='Enter')go()});</script></body></html>
