<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassPulse Live｜講師控制台</title><style>*{box-sizing:border-box}body{margin:0;background:#eff3fb;color:#142044;font-family:Arial,"Noto Sans TC",sans-serif}.wrap{max-width:760px;margin:auto;padding:20px}.brand{color:#315fc8;font-size:14px;font-weight:800;letter-spacing:.1em;margin:8px 0 18px}.card{background:#fff;border-radius:20px;padding:21px;margin:14px 0;box-shadow:0 9px 24px #0d235117}.card h1,.card h2{margin:0 0 8px}.muted{color:#64718a;line-height:1.6}.input{width:100%;padding:14px;border:1px solid #d6dfef;border-radius:12px;font:inherit}.btn{border:0;border-radius:12px;padding:13px 16px;color:#fff;background:#356ce0;font:inherit;font-weight:800;cursor:pointer}.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}.btn.alt{background:#eef3ff;color:#315fc8}.btn.danger{background:#c63744}.row{display:flex;gap:9px;flex-wrap:wrap}.choice{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;border:1px solid #dce4f3;border-radius:13px;background:#fff;padding:14px;margin:7px 0;font:inherit;color:#142044;cursor:pointer;transition:.16s ease}.choice:hover{border-color:#5e72e8;background:#f2f4ff;box-shadow:0 5px 13px #385dc122;transform:translateY(-1px)}.choice.active,.choice.opened{border:2px solid #4d68dd;background:#eceeff}.tag{flex:none;border-radius:99px;background:#4d68dd;color:#fff;padding:4px 8px;font-size:12px;font-weight:800}.barrow{margin:10px 0}.barlabel{display:flex;justify-content:space-between;gap:12px;font-size:14px}.bar{height:9px;background:#edf1f8;border-radius:99px;margin-top:5px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#4285f4,#7a4cdb);border-radius:99px}.answer{border-top:1px solid #edf0f6;padding:10px 0;line-height:1.5}.error{color:#b3261e}.hidden{display:none}.toast{position:fixed;right:18px;bottom:18px;z-index:9;background:#142044;color:#fff;border-radius:12px;padding:13px 16px;box-shadow:0 12px 28px #14204444;opacity:0;transform:translateY(12px);transition:.2s;pointer-events:none}.toast.show{opacity:1;transform:none}</style></head><body><main class="wrap"><div class="brand">● ● ● ● CLASS PULSE LIVE</div><section class="card" id="login"><h1>講師控制台</h1><p class="muted">輸入管理密碼以開啟題庫、即時統計與作答控制。</p><input id="key" class="input" type="password" autocomplete="current-password" placeholder="管理密碼"><p><button class="btn" onclick="login()">進入控制台</button></p><p class="error" id="err"></p></section><div id="app" class="hidden"></div></main><div id="toast" class="toast"></div><script>
const API='https://script.google.com/macros/s/AKfycbw2DmpkxEYlN89Y4zhDgYtf8T9ZrUGDWgO4wHF0ec1eUTB7RjW5XNq69kDHzdfL9erW/exec';let key='',seq=0,data,opened=new Set(JSON.parse(localStorage.getItem('classPulseOpened')||'[]'));
function esc(v){const e=document.createElement('div');e.textContent=v;return e.innerHTML}function toast(t){const x=document.getElementById('toast');x.textContent=t;x.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>x.classList.remove('show'),2800)}function api(p){return new Promise((ok,bad)=>{const cb='admin'+Date.now()+(++seq),s=document.createElement('script');window[cb]=r=>{delete window[cb];s.remove();r.ok?ok(r.data):bad(new Error(r.error||'操作失敗。'))};s.onerror=()=>bad(new Error('無法連線至課堂系統。'));p.callback=cb;s.src=API+'?'+new URLSearchParams(p);document.body.appendChild(s)})}
function login(){key=document.getElementById('key').value;document.getElementById('err').textContent='';if(!key)return;load().catch(e=>{key='';document.getElementById('err').textContent='密碼不正確或連線失敗。'})}function bar(c){const t=Object.values(c).reduce((a,b)=>a+b,0);return Object.entries(c).sort((a,b)=>b[1]-a[1]).map(([n,v])=>'<div class="barrow"><div class="barlabel"><span>'+esc(n)+'</span><b>'+v+'（'+(t?Math.round(v/t*100):0)+'%）</b></div><div class="bar"><span style="width:'+(t?v/t*100:0)+'%"></span></div></div>').join('')}
async function load(){data=await api({api:'adminDashboard',adminKey:key});document.getElementById('login').classList.add('hidden');const app=document.getElementById('app');app.classList.remove('hidden');const a=data.questions.find(q=>q.id===data.activeQuestionId),s=data.stats,p=data.profileStats||{};if(data.activeQuestionId)opened.add(data.activeQuestionId);const profiles=Object.values(p).map(x=>'<section class="card"><h2>'+esc(x.label)+'</h2><p class="muted"><b>'+Object.values(x.counts).reduce((m,n)=>m+n,0)+'</b> 人完成報到</p>'+bar(x.counts)+'</section>').join('');const result=!s?'<section class="card"><h2>尚未開放題目</h2><p class="muted">選擇題目或按「下一題」即可開放。</p></section>':'<section class="card"><h2>目前題目</h2><p>'+esc(a.question)+'</p><p><b>'+s.count+'</b> 人已回答'+(a.type==='quiz'?'，答對率 <b>'+s.correctRate+'%</b>':'')+'</p>'+bar(s.counts)+s.texts.map(x=>'<div class="answer"><b>'+esc(x.name)+'</b><br>'+esc(x.answer)+'</div>').join('')+'</section>';const list=data.questions.map(q=>{const on=opened.has(q.id)||q.id===data.activeQuestionId;return '<button class="choice '+(on?'opened ':'')+(q.id===data.activeQuestionId?'active':'')+'" data-q="'+esc(q.id)+'" onclick="setQ(this.dataset.q,this)"><span><b>P'+esc(q.page)+'</b>　'+esc(q.question)+'</span>'+(on?'<span class="tag">已開</span>':'')+'</button>'}).join('');app.innerHTML='<div class="row"><button class="btn alt" onclick="nav(\'prev\')">上一題</button><button class="btn" onclick="nav(\'next\')">下一題</button><button class="btn alt" onclick="setQ(\'\')">關閉作答</button></div>'+result+'<section class="card"><h2>現場報到樣態</h2>'+profiles+'</section><section class="card"><h2>講座互動題庫</h2>'+list+'</section><button class="btn danger" onclick="wipe()">刪除測試回答</button>'}
async function setQ(id,button){if(id){opened.add(id);localStorage.setItem('classPulseOpened',JSON.stringify([...opened]));if(button){button.classList.add('opened');if(!button.querySelector('.tag'))button.insertAdjacentHTML('beforeend','<span class="tag">已開</span>')}toast('正在開放題目…')}try{await api({api:'adminSetActive',adminKey:key,questionId:id});toast(id?'題目已開放給學員':'已關閉作答');load()}catch(e){toast('開放未完成，請再試一次。')}}async function nav(d){toast('正在切換題目…');try{await api({api:'adminNavigate',adminKey:key,direction:d});toast('題目已開放給學員');load()}catch(e){toast('切換未完成，請再試一次。')}}async function wipe(){if(!confirm('確定刪除所有回答？'))return;if(!confirm('再次確認，這個動作無法復原。'))return;await api({api:'deleteTestResponses',adminKey:key});load()}setInterval(()=>key&&load().catch(()=>{}),5000);document.getElementById('key').addEventListener('keydown',e=>e.key==='Enter'&&login());
async function resetAll(){if(!confirm('確定清除所有學員報到與作答資料？'))return;if(!confirm('再次確認：題目會關閉，所有「已開」標籤與統計將歸零。'))return;await api({api:'deleteTestResponses',adminKey:key});opened.clear();localStorage.removeItem('classPulseOpened');toast('已完整重置課堂資料');load()}wipe=resetAll;
</script></body></html>
