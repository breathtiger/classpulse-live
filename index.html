<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClassPulse Live｜智慧零售升級</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#eff3fb;color:#142044;font-family:Arial,"Noto Sans TC",sans-serif}.page{max-width:620px;min-height:100vh;margin:auto;background:#fff}.hero{position:relative;min-height:430px;padding:25px 23px;color:#fff;overflow:hidden;background:linear-gradient(140deg,#0c245c,#2453ad 53%,#6a37a9)}.art{position:absolute;inset:0;z-index:0;width:100%;height:100%;object-fit:cover;object-position:65% center;opacity:.43;mix-blend-mode:screen}.hero>*:not(.art){position:relative;z-index:1}.brand{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:700;letter-spacing:.07em}.dots{display:flex;gap:4px}.dots i{width:9px;height:9px;border-radius:50%}.dots i:nth-child(1){background:#4285f4}.dots i:nth-child(2){background:#ea4335}.dots i:nth-child(3){background:#fbbc05}.dots i:nth-child(4){background:#34a853}.kicker{margin:52px 0 8px;font-size:13px;letter-spacing:.08em}.hero h1{font-size:34px;line-height:1.2;margin:0;font-weight:800}.hero h1 em{font-style:normal;color:#ffdc69}.topic{font-size:19px;font-weight:700;margin:14px 0 38px}.footer{display:flex;justify-content:space-between;align-items:center;font-size:12px}.live{padding:5px 9px;border:1px solid #ffffff78;border-radius:99px;font-weight:bold;letter-spacing:.1em}.live:before{content:"";display:inline-block;width:7px;height:7px;border-radius:99px;background:#ea4335;margin-right:5px}.stage{margin-top:-28px;padding:0 16px 35px;position:relative}.card{padding:25px;border-radius:23px;background:#fff;box-shadow:0 14px 35px #0d235126}.eyebrow{font-size:11px;color:#604cd7;letter-spacing:.16em;font-weight:800}.card h2{font-size:24px;margin:9px 0}.card p{color:#5b6782;line-height:1.65}.input{width:100%;border:1px solid #d9e0ef;border-radius:13px;padding:15px;font:inherit;background:#f9fbff}.button{display:flex;width:100%;justify-content:space-between;align-items:center;margin-top:15px;padding:15px 17px;border:0;border-radius:13px;background:linear-gradient(105deg,#306de8,#6545d9);color:white;font:bold 16px inherit;cursor:pointer}.button b{font-size:23px}.note{padding:17px 4px 0;text-align:center;color:#77829a;font-size:12px}.links{display:flex;justify-content:center;gap:14px;margin-top:9px}.links a{color:#335fc8;text-decoration:none;font-weight:bold}.success{display:none;text-align:center}.check{display:grid;place-items:center;width:58px;height:58px;margin:auto;border-radius:18px;background:#e3f7ec;color:#148447;font-size:30px;font-weight:bold}@media(max-width:420px){.hero{min-height:415px}.hero h1{font-size:30px}.card{padding:22px}}
  </style>
</head>
<body><main class="page">
  <header class="hero">
    <img class="art" src="assets/retail-prediction-hero.png" alt="智慧零售商品預測插畫">
    <div class="brand"><span class="dots"><i></i><i></i><i></i><i></i></span>CLASS PULSE LIVE</div>
    <p class="kicker">竹北就業中心一般就業促進課程</p>
    <h1>智慧零售升級<br><em>數位行銷秘密</em></h1>
    <p class="topic">手機推薦商品怎麼來</p>
    <div class="footer"><span>新譽管理有限公司 協辦</span><span class="live">LIVE</span></div>
  </header>
  <section class="stage"><div class="card" id="login">
    <span class="eyebrow">WELCOME</span><h2>加入今日課程互動</h2>
    <p>輸入顯示名稱或匿名編號，立即參與投票、測驗與提問。</p>
    <input class="input" id="name" maxlength="60" placeholder="例如：王小明／A-012">
    <button class="button" onclick="join()">開始參與 <b>→</b></button>
  </div><div class="card success" id="success"><div class="check">✓</div><span class="eyebrow">CONNECTED</span><h2>歡迎加入，<span id="shown"></span></h2><p id="status">正在連線至課堂系統…</p></div><div class="card" id="question" style="display:none"></div>
  <p class="note">課程互動視覺展示<div class="links"><a href="./">學員頁</a><a href="Admin.html">講師頁</a></div></p></section>
</main><script>
const API='https://script.google.com/macros/s/AKfycbw2DmpkxEYlN89Y4zhDgYtf8T9ZrUGDWgO4wHF0ec1eUTB7RjW5XNq69kDHzdfL9erW/exec';let profile=null,serial=0;
function esc(v){const x=document.createElement('div');x.textContent=v;return x.innerHTML}function api(params){return new Promise((resolve,reject)=>{const cb='cp'+Date.now()+(++serial);window[cb]=r=>{delete window[cb];s.remove();r.ok?resolve(r.data):reject()};const s=document.createElement('script');s.onerror=()=>reject();params.callback=cb;params.api&&Object.keys(params).forEach(k=>{});s.src=API+'?'+new URLSearchParams(params);document.body.appendChild(s)})}
function join(){const v=document.getElementById('name').value.trim();if(!v){document.getElementById('name').focus();return}profile={name:v,id:'p_'+crypto.randomUUID().replaceAll('-','')};localStorage.setItem('classPulseProfile',JSON.stringify(profile));start()}
function start(){profile=profile||JSON.parse(localStorage.getItem('classPulseProfile')||'null');if(!profile)return;document.getElementById('shown').textContent=profile.name;document.getElementById('login').style.display='none';document.getElementById('success').style.display='block';load()}
function checkinForm(){const box=document.getElementById('question');document.getElementById('success').style.display='none';box.style.display='block';if(document.getElementById('gender'))return;box.innerHTML='<span class="eyebrow">CHECK-IN</span><h2>先完成課前報到</h2><p>資料僅用於本次課程的即時統計，可使用匿名名稱。</p><label>性別<select class="input" id="gender"><option value="">請選擇</option><option>女性</option><option>男性</option><option>非二元／其他</option><option>不透露</option></select></label><label>年齡<select class="input" id="age"><option value="">請選擇</option><option>18 歲以下</option><option>19-25 歲</option><option>26-35 歲</option><option>36-45 歲</option><option>46-55 歲</option><option>56 歲以上</option></select></label><label>職業<input class="input" id="job" maxlength="60" placeholder="例如：零售業／學生／服務業"></label><label>居住縣市<input class="input" id="city" maxlength="60" placeholder="例如：新竹縣"></label><button class="button" onclick="submitCheckin()">完成報到 <b>→</b></button>'}
async function submitCheckin(){const p={gender:document.getElementById('gender').value,age:document.getElementById('age').value,job:document.getElementById('job').value.trim(),city:document.getElementById('city').value.trim()};if(!p.gender||!p.age||!p.job||!p.city){alert('請完整填寫四項報到資料。');return}const encoded=btoa(unescape(encodeURIComponent(JSON.stringify(p)))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');try{await api({api:'checkin',participantId:profile.id,participantName:profile.name,profile:encoded});load()}catch(e){alert('報到送出未完成，請再試一次。')}}
async function load(){try{const d=await api({api:'state',participantId:profile.id});if(d.checkinRequired){checkinForm();return}const q=d.activeQuestion,box=document.getElementById('question');if(!q){box.style.display='none';document.getElementById('success').style.display='block';document.getElementById('status').textContent='請等待講師開放下一題。';return}document.getElementById('success').style.display='none';box.style.display='block';if(d.submitted){box.innerHTML='<div class="check">✓</div><h2 style="text-align:center">已成功送出</h2><p style="text-align:center">請等待下一題開放。</p>';return}const opts=q.type==='open_text'?'<textarea class="input" id="answer" placeholder="輸入你的回答…"></textarea>':q.options.map(o=>'<label style="display:flex;gap:10px;align-items:center;padding:13px;margin:9px 0;border:1px solid #dde3ef;border-radius:12px"><input name="a" type="'+(q.type==='multiple'?'checkbox':'radio')+'" value="'+esc(o)+'">'+esc(o)+'</label>').join('');box.innerHTML='<span class="eyebrow">SLIDE '+q.page+'</span><h2>'+esc(q.question)+'</h2>'+opts+'<button class="button" onclick="submitAnswer('+JSON.stringify(q.id)+','+JSON.stringify(q.type)+')">送出答案 <b>→</b></button>'}catch(e){document.getElementById('status').textContent='連線暫時無法完成，系統將自動重試。'}}
async function submitAnswer(id,type){let a;if(type==='open_text')a=document.getElementById('answer').value;else{const x=[...document.querySelectorAll('[name=a]:checked')].map(n=>n.value);a=type==='multiple'?x:x[0]}if(!a||Array.isArray(a)&&!a.length){alert('請先選擇或輸入答案。');return}const btn=document.querySelector('#question .button');document.querySelectorAll('#question input,#question textarea').forEach(x=>x.disabled=true);btn.disabled=true;btn.style.opacity='.72';btn.innerHTML='送出中…';const status=document.createElement('p');status.id='sendStatus';status.style.cssText='margin:12px 0 0;text-align:center;color:#5d58cb;font-weight:700';status.textContent='傳輸中…請不要關閉此頁面';btn.after(status);const ans=btoa(unescape(encodeURIComponent(JSON.stringify(a)))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');try{await api({api:'submit',participantId:profile.id,participantName:profile.name,questionId:id,answer:ans});document.getElementById('question').innerHTML='<div class="check">✓</div><h2 style="text-align:center">答案已送出</h2><p style="text-align:center">系統已成功記錄你的答案，請等待下一題開放。</p>'}catch(e){document.querySelectorAll('#question input,#question textarea').forEach(x=>x.disabled=false);btn.disabled=false;btn.style.opacity='1';btn.innerHTML='重新送出答案 <b>→</b>';status.textContent='傳輸未完成，請按「重新送出答案」。';status.style.color='#b3261e'}}
const originalCheckinForm=checkinForm;checkinForm=function(){originalCheckinForm();const age=document.getElementById('age');if(age)age.innerHTML='<option value="">請選擇</option><option>18 歲以下</option><option>19-25 歲</option><option>26-35 歲</option><option>36-45 歲</option><option>46-55 歲</option><option>56-65 歲</option><option>65-75 歲</option><option>75 歲以上</option>';const city=document.getElementById('city');if(!city||city.tagName!=='INPUT')return;const places=['新竹縣','新竹市','桃園市','苗栗縣','新北市','臺北市','臺中市','基隆市','宜蘭縣','彰化縣','南投縣','花蓮縣','雲林縣','嘉義市','嘉義縣','臺南市','臺東縣','高雄市','屏東縣','澎湖縣','金門縣','連江縣'];const select=document.createElement('select');select.className='input';select.id='city';select.innerHTML='<option value="">請選擇居住縣市</option>'+places.map(x=>'<option value="'+x+'">'+x+'</option>').join('');city.replaceWith(select)};let requestInFlight=false;api=function(params){return new Promise((resolve,reject)=>{const cb='cp'+Date.now()+(++serial),s=document.createElement('script'),timer=setTimeout(()=>finish(false),12000);function finish(ok,value){clearTimeout(timer);delete window[cb];s.remove();ok?resolve(value):reject(new Error('連線逾時'))}window[cb]=r=>r.ok?finish(true,r.data):finish(false);s.onerror=()=>finish(false);params.callback=cb;s.src=API+'?'+new URLSearchParams(params);document.body.appendChild(s)})};const originalLoad=load;load=async function(){if(requestInFlight)return;requestInFlight=true;try{return await originalLoad()}finally{requestInFlight=false}};start();setInterval(()=>profile&&load(),60000);
</script></body></html>
