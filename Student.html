<!doctype html><html><head><base target="_top"><!-- 下列 link 讓本機直接開啟時也能看到完整視覺；部署後由 include 注入樣式。 --><link rel="stylesheet" href="Styles.html"><?!= include('Styles'); ?></head><body class="student-body"><main class="student-wrap"><header class="course-hero"><div class="hero-orb orb-one"></div><div class="hero-orb orb-two"></div><img class="hero-art" src="assets/retail-prediction-hero.png" alt="智慧零售商品預測視覺插畫"><div class="brand brand-light"><span class="dots"><i class="b"></i><i class="r"></i><i class="y"></i><i class="g"></i></span>課堂即時互動</div><p class="hero-kicker">竹北就業中心一般就業促進課程</p><h1>智慧零售升級<br><em>數位行銷秘密</em></h1><p class="hero-topic">手機推薦商品怎麼來</p><div class="hero-footer"><span>新譽管理有限公司 協辦</span><span class="live-dot">LIVE</span></div></header><section class="student-stage"><div id="app"><p class="muted">載入中…</p></div></section></main><script>
const app=document.getElementById('app');let profile=JSON.parse(localStorage.getItem('classProfile')||'null'),lastId='',busy=false;
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
function call(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(e=>reject(new Error(e.message||'發生錯誤，請稍後再試。')))[fn](...args))}
function profileForm(){app.innerHTML='<section class="card student-card welcome-card"><span class="eyebrow">WELCOME</span><h2>加入今日課程互動</h2><p class="muted">輸入顯示名稱或匿名編號，立即參與投票、測驗與提問。</p><input id="name" maxlength="60" placeholder="例如：王小明／A-012"><p id="msg"></p><button class="btn btn-gradient" onclick="saveProfile()">開始參與 <span>→</span></button></section>'}
function saveProfile(){const name=document.getElementById('name').value.trim().replace(/[<>]/g,'');if(!name){document.getElementById('msg').textContent='請輸入名稱或匿名編號。';return}profile={name:name.slice(0,60),id:'p_'+cryptoRandom()};localStorage.setItem('classProfile',JSON.stringify(profile));load()}
function cryptoRandom(){return (crypto&&crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/[^A-Za-z0-9_-]/g,'')}
async function load(){if(!profile)return profileForm();try{const s=await call('getStudentState',profile.id);const q=s.activeQuestion;if(!q){lastId='';app.innerHTML='<section class="card student-card wait-card"><div class="wait-icon">✦</div><span class="eyebrow">READY</span><h2>請等待講師開放下一題</h2><p class="muted">題目開放後，這裡會自動更新。</p><div class="loading-line"><i></i></div></section>';return}if(s.submitted){lastId=q.id;app.innerHTML='<section class="card student-card success-card"><div class="check-mark">✓</div><span class="eyebrow">SENT</span><h2>已成功送出</h2><p class="muted">感謝你的參與，請等待下一題開放。</p></section>';return}if(lastId!==q.id||!document.querySelector('[name=answer]'))render(q)}catch(e){app.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function render(q){lastId=q.id;let fields='';if(q.type==='open_text')fields='<textarea id="open" maxlength="500" placeholder="輸入你的回答…"></textarea>';else fields=q.options.map((o,i)=>'<label class="choice student-choice"><span class="choice-index">'+String(i+1).padStart(2,'0')+'</span><input name="answer" type="'+(q.type==='multiple'?'checkbox':'radio')+'" value="'+esc(o)+'"><span>'+esc(o)+'</span><b>›</b></label>').join('');app.innerHTML='<section class="card student-card question-card"><div class="question-meta"><span class="pill">QUESTION '+String(q.page).padStart(2,'0')+'</span><span>'+esc(q.type.replace('_',' '))+'</span></div><h2>'+esc(q.question)+'</h2>'+fields+'<p id="msg"></p><button class="btn btn-gradient topspace" onclick="send('+JSON.stringify(q.id)+')">送出我的答案 <span>→</span></button></section>'}
async function send(id){if(busy)return;let answer;if(document.getElementById('open'))answer=document.getElementById('open').value;else {const all=[...document.querySelectorAll('[name=answer]:checked')].map(x=>x.value);answer=all.length>1?all:all[0]||''}busy=true;try{await call('submitResponse',{participantId:profile.id,participantName:profile.name,questionId:id,answer:answer});await load()}catch(e){document.getElementById('msg').innerHTML='<span class="error">'+esc(e.message)+'</span>'}finally{busy=false}}
load();setInterval(load,5000);
</script></body></html>
