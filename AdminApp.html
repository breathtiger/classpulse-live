<!doctype html><html><head><base target="_top"><?!= include('Styles'); ?></head><body><main class="wrap"><div class="brand"><span class="dots"><i class="b"></i><i class="r"></i><i class="y"></i><i class="g"></i></span>講師控制台</div><div id="app">載入中…</div></main><script>
const key=<?= JSON.stringify(adminKey) ?>,app=document.getElementById('app');let data;
function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}function call(f,...a){return new Promise((y,n)=>google.script.run.withSuccessHandler(y).withFailureHandler(e=>n(new Error(e.message||'操作失敗。')))[f](key,...a))}
function bars(counts){const total=Object.values(counts).reduce((a,b)=>a+b,0);return Object.entries(counts).sort((a,b)=>b[1]-a[1]).map(([o,n])=>'<div class="barrow"><div class="barlabel"><span>'+esc(o)+'</span><b>'+n+'（'+(total?Math.round(n/total*100):0)+'%）</b></div><div class="bar"><span style="width:'+(total?n/total*100:0)+'%"></span></div></div>').join('')}
async function load(){try{data=await call('getAdminDashboard');render()}catch(e){app.innerHTML='<p class="error">'+esc(e.message)+'</p>'}}
function render(){const s=data.stats,active=data.questions.find(q=>q.id===data.activeQuestionId),p=data.profileStats||{};const profile=Object.keys(p).map(id=>'<section class="card"><h2>'+esc(p[id].label)+'</h2><p><b>'+Object.values(p[id].counts).reduce((a,b)=>a+b,0)+'</b> 人完成報到</p>'+bars(p[id].counts)+'</section>').join('');let stats='<p class="muted">目前尚未開放題目。</p>';if(s){const text=s.texts.map(t=>'<div class="text-answer"><b>'+esc(t.name)+'</b><br>'+esc(t.answer)+'</div>').join('');const quizRate=active.type==='quiz'?' · 答對率 <b>'+s.correctRate+'%</b>':'';stats='<section class="card"><h2>目前題目：'+esc(active.question)+'</h2><p><b>'+s.count+'</b> 人已回答'+quizRate+'</p>'+bars(s.counts)+text+'</section>'}const list=data.questions.map(q=>'<button class="choice '+(q.id===data.activeQuestionId?'active':'')+'" onclick="setActive('+JSON.stringify(q.id)+')"><span><b>投影片 '+esc(q.page)+'</b> · '+esc(q.type)+'<br>'+esc(q.question)+'</span></button>').join('');app.innerHTML='<div class="row"><button class="btn alt" onclick="nav(\'prev\')">上一題</button><button class="btn alt" onclick="nav(\'next\')">下一題</button><button class="btn" onclick="closeQ()">關閉作答</button></div><section class="card"><h2>現場報到樣態</h2><p>性別、年齡、職業與居住縣市即時統計</p></section>'+profile+stats+'<section class="card question-list"><h2>講座互動題庫</h2>'+list+'</section><button class="btn danger" onclick="wipe()">刪除所有測試回答</button>'}
async function setActive(id){await call('adminSetActive',id);load()}async function nav(d){await call('adminNavigate',d);load()}async function closeQ(){await call('adminSetActive','');load()}async function wipe(){if(!confirm('確定要刪除所有回答嗎？此動作無法復原。'))return;if(!confirm('再次確認：真的要刪除所有測試回答？'))return;await call('deleteTestResponses');load()}load();setInterval(load,5000);
</script></body></html>
