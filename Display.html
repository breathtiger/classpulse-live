<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ClassPulse Live｜即時互動牆</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;color:#fff;background:radial-gradient(circle at 12% 10%,#315fbd 0,transparent 35%),linear-gradient(135deg,#081d4d,#27206d 58%,#5b248d);font-family:Arial,"Noto Sans TC",sans-serif}.screen{max-width:1440px;min-height:100vh;margin:auto;padding:38px 5vw}.top{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:16px;letter-spacing:.13em;font-weight:800}.live{border:1px solid #ffffff55;border-radius:99px;padding:8px 13px;font-weight:700}.live:before{content:"";display:inline-block;width:9px;height:9px;background:#ff5a5f;border-radius:50%;margin-right:8px}.eyebrow{margin:9vh 0 12px;color:#aebeff;font-size:15px;font-weight:800;letter-spacing:.15em}.question{font-size:clamp(32px,5vw,72px);line-height:1.18;max-width:1120px;margin:0}.count{font-size:20px;color:#d7defe;margin:22px 0 32px}.count b{color:#fff;font-size:32px}.bars{max-width:1150px}.barrow{margin:19px 0}.label{display:flex;justify-content:space-between;gap:20px;font-size:clamp(19px,2.2vw,29px);font-weight:700}.track{height:28px;background:#ffffff1d;border-radius:99px;overflow:hidden;margin-top:9px}.fill{height:100%;border-radius:99px;background:linear-gradient(90deg,#4f9cff,#8a57ff);transition:width .55s ease}.cloud{display:flex;flex-wrap:wrap;gap:17px;align-items:center;max-width:1220px;margin-top:34px}.word{display:inline-block;padding:10px 15px;border-radius:99px;background:#ffffff12;border:1px solid #ffffff36;line-height:1.1;animation:in .35s ease both}.latest{margin-top:36px;display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:13px;max-width:1200px}.reply{border-left:4px solid #6d8dff;background:#ffffff10;border-radius:0 13px 13px 0;padding:16px;font-size:18px;line-height:1.55}.empty{display:grid;place-items:center;min-height:64vh;text-align:center}.empty h1{font-size:clamp(34px,6vw,76px);margin:15px 0}.empty p{color:#d7defe;font-size:21px}@keyframes in{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}@media(max-width:600px){.screen{padding:24px}.eyebrow{margin-top:12vh}.track{height:20px}.latest{grid-template-columns:1fr}}</style></head><body><main class="screen"><header class="top"><div class="brand">● ● ● ● CLASS PULSE LIVE</div><div class="live">即時統計</div></header><div id="app" class="empty"><div><p>等待講師開放題目</p><h1>課堂互動即時牆</h1><p>學員送出答案後，結果會自動更新</p></div></div></main><script src="assets/client.js?v=stable1" defer></script><script src="assets/display.js?v=stable1" defer></script></body></html>
